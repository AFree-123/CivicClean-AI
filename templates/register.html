{% extends "base.html" %}
{% block body %}
<div class="auth-page register-page">
  <a class="auth-brand" href="{{ url_for('home') }}"><span class="brand-mark">🍃</span><strong>CivicClean AI</strong></a>

  <div class="register-decor register-decor-left" aria-hidden="true">🍃</div>
  <div class="register-decor register-decor-right" aria-hidden="true">🍃</div>

  <div class="auth-card register-card">
    <div class="auth-logo">🍃</div>
    <h1>Create Your Account</h1>
    <p>Join our community for a cleaner planet</p>

    <div class="role-tabs role-tabs-two">
      <button type="button" class="selected">Citizen</button>
      <button type="button">Admin</button>
    </div>

    <form method="post" class="form-stack register-form">
      <label>Full Name<input name="name" placeholder="Enter your full name" required></label>
      <label>Email Address<input type="email" name="email" placeholder="you@example.com" required></label>
      <label>Password<div class="password-field"><input type="password" name="password" placeholder="Create a password" required><button type="button" class="password-toggle" onclick="togglePassword(this)">◉</button></div></label>
      <label>Confirm Password<div class="password-field"><input type="password" name="confirm_password" placeholder="Confirm your password" required><button type="button" class="password-toggle" onclick="togglePassword(this)">◉</button></div></label>
      <button class="btn btn-primary btn-block register-submit" type="submit">Sign Up <span>→</span></button>
    </form>

    <div class="or"><span>or continue with</span></div>
    <div class="social-row register-social">
      <button type="button" class="social-btn"><span class="google-g">G</span> Google</button>
      <button type="button" class="social-btn"><span class="microsoft-mark"><i></i><i></i><i></i><i></i></span> Microsoft</button>
    </div>

    <p class="auth-bottom">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>

  <div class="register-footer">CLEAN COMMUNITIES. &nbsp; BRIGHTER TOMORROW.</div>
</div>
{% endblock %}
